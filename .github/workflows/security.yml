name: Security scan

# Weekly scan of the code, the dependencies and the workflows for security issues.
# Each scanner writes SARIF; the report job turns the findings into GitHub issues
# with the label "security" (see .github/scripts/security_issues.py).
on:
  schedule:
    # Fridays 05:00 UTC = 06:00 in Germany in winter (07:00 in summer: cron is UTC only).
    - cron: "0 5 * * 5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-scan
  cancel-in-progress: false

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  OSV_SCANNER_VERSION: "2.7.0"
  OSV_SCANNER_SHA256: "160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b"
  ZIZMOR_VERSION: "1.31.1"
  BANDIT_VERSION: "1.9.4"
  SEMGREP_VERSION: "1.183.0"

jobs:
  secrets:
    name: Secrets in the git history (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "$GITLEAKS_SHA256  $archive" | sha256sum -c -
          tar xzf "$archive" gitleaks
      - name: Scan
        # --redact: the issues must not repeat a leaked secret.
        run: ./gitleaks git --redact --no-banner --report-format sarif --report-path gitleaks.sarif --exit-code 0 .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sarif-gitleaks
          path: gitleaks.sarif

  dependencies:
    name: Vulnerable dependencies (OSV-Scanner, OSV database)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install OSV-Scanner
        run: |
          curl -sSfLo osv-scanner "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "$OSV_SCANNER_SHA256  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner
      - name: Scan the lock files (NuGet packages.lock.json, ...)
        # Exit code 1 means vulnerabilities were found (reported as issues); more is an error.
        run: |
          status=0
          ./osv-scanner scan source --recursive --format sarif --output-file osv-scanner.sarif . || status=$?
          [ "$status" -le 1 ]
      - name: Check the build tools (WiX Toolset and extensions)
        run: python3 .github/scripts/osv_tools.py .github/workflows/build.yml osv-build-tools.sarif
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sarif-dependencies
          path: "*.sarif"

  workflows:
    name: GitHub Actions workflows (zizmor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install zizmor
        run: pipx install "zizmor==$ZIZMOR_VERSION"
      - name: Scan
        # Online audits (e.g. actions with known vulnerabilities) use the token.
        # Exit codes 10-14 mean findings (reported as issues); 1 and others are errors.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=0
          zizmor --format sarif .github/workflows > zizmor.sarif || status=$?
          [ "$status" -eq 0 ] || [ "$status" -ge 10 ]
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sarif-zizmor
          path: zizmor.sarif

  code:
    name: Code (Bandit for Python, Semgrep for C#, shell, JavaScript, ...)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Bandit and Semgrep
        run: |
          pipx install "bandit[sarif]==$BANDIT_VERSION"
          pipx install "semgrep==$SEMGREP_VERSION"
      - name: Bandit (Linux app and CI scripts, medium and high severity)
        # Exit code 1 means findings (reported as issues).
        run: |
          status=0
          bandit --recursive src/linux/app .github/scripts --exclude '*/test_*.py' \
            --severity-level medium --format sarif --output bandit.sarif || status=$?
          [ "$status" -le 1 ]
      - name: Semgrep (security rules of the Semgrep registry)
        run: |
          semgrep scan --config p/security-audit --config p/secrets --config p/csharp \
            --config p/javascript --config p/bash \
            --exclude 'test_*.py' --exclude 'src/windows/tests' \
            --sarif --output semgrep.sarif
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sarif-code
          path: "*.sarif"

  report:
    name: Create issues for the findings
    needs: [secrets, dependencies, workflows, code]
    # Report what the scanners that worked found, even if another one failed.
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sarif-*
          path: sarif
      - name: Test the reporter
        run: python3 -m unittest discover -s .github/scripts
      - name: Create, reopen and close issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/security_issues.py sarif
      - name: Fail if a scanner failed
        if: contains(needs.*.result, 'failure')
        run: |
          echo "::error::A scanner failed, its findings are missing (see the jobs above)."
          exit 1
