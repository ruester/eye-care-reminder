name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux installer (.bin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - name: Determine version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi
      - run: just build-linux
      - uses: actions/upload-artifact@v4
        with:
          name: linux-installer
          path: build/eye-care-reminder-*-linux.bin
          if-no-files-found: error

  windows:
    name: Windows installer (.msi)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - name: Install WiX Toolset
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add --global WixToolset.Util.wixext/5.0.2
          wix extension add --global WixToolset.UI.wixext/5.0.2
      - name: Determine version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi
      - run: just build-windows
      - name: Test installer (upgrade and uninstall while the app is running)
        shell: pwsh
        timeout-minutes: 10
        run: |
          $new = (Resolve-Path "build/eye-care-reminder-$env:VERSION-windows-x64.msi").Path
          $expected = $env:VERSION
          $env:VERSION = "0.0.0"
          just build-windows
          $old = (Resolve-Path "build/eye-care-reminder-0.0.0-windows-x64.msi").Path
          ./src/windows/installer/Test-Installer.ps1 -OldMsi $old -NewMsi $new -ExpectedVersion $expected
          Remove-Item $old
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: installer-test-logs
          path: "*.log"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: build/eye-care-reminder-*-windows-x64.msi
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/eye-care-reminder-*-linux.bin
            dist/eye-care-reminder-*-windows-x64.msi
          generate_release_notes: true
