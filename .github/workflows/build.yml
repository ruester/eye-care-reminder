name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
    # The website is deployed by pages.yml; no need to rebuild the installers for it.
    paths-ignore: ["site/**", ".github/workflows/pages.yml"]
  pull_request:
    paths-ignore: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux installer (.bin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - name: Determine version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi
      - name: Check that the tag matches release_version in the justfile
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          expected="$(just --evaluate release_version)"
          if [[ "$VERSION" != "$expected" ]]; then
            echo "::error::Tag v$VERSION doesn't match release_version $expected in the justfile. Release with: just release $VERSION"
            exit 1
          fi
      - run: just build-linux
      - uses: actions/upload-artifact@v4
        with:
          name: linux-installer
          path: build/eye-care-reminder-*-linux.bin
          if-no-files-found: error

  windows:
    name: Windows installer (.msi)
    runs-on: windows-latest
    permissions:
      contents: write # push the coverage badge to the badges branch
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - name: Install WiX Toolset
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add --global WixToolset.Util.wixext/5.0.2
          wix extension add --global WixToolset.UI.wixext/5.0.2
      - name: Determine version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi
      - name: Unit tests with coverage
        run: just test-windows
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-test-results
          path: build/test-results
          if-no-files-found: ignore
      - name: Publish coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The badges branch holds only the latest badge (single force-pushed commit).
          # Pushes made with GITHUB_TOKEN don't trigger workflows.
          $percent = [int](Get-Content build/test-results/coverage-percent.txt)
          $color = if ($percent -ge 80) { "brightgreen" } elseif ($percent -ge 60) { "green" } `
                   elseif ($percent -ge 40) { "yellow" } elseif ($percent -ge 20) { "orange" } else { "red" }
          $dir = Join-Path $env:RUNNER_TEMP badges
          New-Item -ItemType Directory $dir | Out-Null
          Invoke-WebRequest "https://img.shields.io/badge/Windows%20unit%20test%20coverage-$percent%25-$color" -OutFile "$dir/windows-coverage.svg"
          git -C $dir init -q -b badges
          git -C $dir add windows-coverage.svg
          git -C $dir -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Windows coverage $percent% ($env:GITHUB_SHA)"
          git -C $dir push -q -f "https://x-access-token:$env:GH_TOKEN@github.com/$env:GITHUB_REPOSITORY.git" HEAD:badges
      - run: just build-windows
      - name: Test installer (upgrade and uninstall while the app is running)
        shell: pwsh
        timeout-minutes: 10
        run: |
          $new = (Resolve-Path "build/eye-care-reminder-$env:VERSION-windows-x64.msi").Path
          $expected = $env:VERSION
          $env:VERSION = "0.0.0"
          just build-windows
          $old = (Resolve-Path "build/eye-care-reminder-0.0.0-windows-x64.msi").Path
          ./src/windows/installer/Test-Installer.ps1 -OldMsi $old -NewMsi $new -ExpectedVersion $expected
          Remove-Item $old
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: installer-test-logs
          path: "*.log"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: build/eye-care-reminder-*-windows-x64.msi
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/eye-care-reminder-*-linux.bin
            dist/eye-care-reminder-*-windows-x64.msi
          generate_release_notes: true
