name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
    # The website is deployed by pages.yml; no need to rebuild the installers for it.
    paths-ignore: ["site/**", ".github/workflows/pages.yml"]
  pull_request:
    paths-ignore: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux installer (.bin)
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit the coverage badge to main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: "1.59.0"
      - name: Install test dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends python3-gi python3-gi-cairo gir1.2-gtk-3.0 \
            python3-coverage xvfb xauth xdotool dbus dbus-x11
      - name: Determine version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi
      - name: Check shell scripts
        run: |
          shellcheck -s sh src/linux/installer/*.sh src/linux/tests/*.sh
          shellcheck .github/scripts/*.sh
      - name: Unit tests with coverage
        env:
          PYTHON: /usr/bin/python3
        run: just test-linux
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: linux-test-results
          path: build/linux-test-results/coverage.xml
          if-no-files-found: ignore
      - name: Publish coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/publish-coverage-badge.sh Linux "$(cat build/linux-test-results/coverage-percent.txt)"
      - run: just build-linux
      - name: Test installer (install, upgrade and uninstall while the app is running)
        timeout-minutes: 10
        run: |
          new="build/eye-care-reminder-$VERSION-linux.bin"
          VERSION=0.0.0 just build-linux
          xvfb-run -a dbus-run-session sh src/linux/tests/test-installer.sh \
            build/eye-care-reminder-0.0.0-linux.bin "$new" "$VERSION"
          rm build/eye-care-reminder-0.0.0-linux.bin
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-installer
          path: build/eye-care-reminder-*-linux.bin
          if-no-files-found: error

  windows:
    name: Windows installer (.msi)
    runs-on: windows-latest
    permissions:
      contents: write # commit the coverage badge to main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: "1.59.0"
      - name: Install WiX Toolset
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add --global WixToolset.Util.wixext/5.0.2
          wix extension add --global WixToolset.UI.wixext/5.0.2
      - name: Determine version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          fi
      - name: Unit tests with coverage
        run: just test-windows
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-test-results
          path: build/test-results
          if-no-files-found: ignore
      - name: Publish coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/publish-coverage-badge.sh Windows "$(cat build/test-results/coverage-percent.txt | tr -d '[:space:]')"
      - run: just build-windows
      - name: Test installer (upgrade and uninstall while the app is running)
        shell: pwsh
        timeout-minutes: 10
        run: |
          $new = (Resolve-Path "build/eye-care-reminder-$env:VERSION-windows-x64.msi").Path
          $expected = $env:VERSION
          $env:VERSION = "0.0.0"
          just build-windows
          $old = (Resolve-Path "build/eye-care-reminder-0.0.0-windows-x64.msi").Path
          ./src/windows/installer/Test-Installer.ps1 -OldMsi $old -NewMsi $new -ExpectedVersion $expected
          Remove-Item $old
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: installer-test-logs
          path: "*.log"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installer
          path: build/eye-care-reminder-*-windows-x64.msi
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Needed for the tag fetch; this job uploads no artifacts.
          persist-credentials: true # zizmor: ignore[artipacked]
      - name: Release notes from the tag message
        run: |
          # actions/checkout turns the pushed tag into a lightweight one: fetch the real tag object.
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          if [ "$(git cat-file -t "$GITHUB_REF_NAME")" = tag ]; then
            git tag -l --format='%(contents:subject)%0a%0a%(contents:body)' "$GITHUB_REF_NAME" > release-notes.md
          else
            echo "::warning::$GITHUB_REF_NAME is not an annotated tag, the release has no notes. Tag with: git tag -a $GITHUB_REF_NAME -m \"...\""
            : > release-notes.md
          fi
          cat release-notes.md
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        # The tag message, followed by GitHub's generated notes ("Full Changelog" link).
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md --generate-notes \
            dist/eye-care-reminder-*-linux.bin dist/eye-care-reminder-*-windows-x64.msi

  update-download-links:
    name: Update download links on main
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write # push to main
      actions: write # start the website deployment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          # Needed to push to main; this job uploads no artifacts.
          persist-credentials: true # zizmor: ignore[artipacked]
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: "1.59.0"
      - name: Set release_version and the download links to the new release
        run: just bump-version "${GITHUB_REF_NAME#v}"
      - name: Commit and push to main
        id: commit
        run: |
          if git diff --quiet; then
            echo "Download links are already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -am "Update download links to $GITHUB_REF_NAME"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git pull -q --rebase origin main
          done
          echo "::error::Could not push the download link update to main"
          exit 1
      # Pushes made with GITHUB_TOKEN don't trigger workflows, but a workflow_dispatch does.
      - name: Deploy the website
        if: steps.commit.outputs.pushed == 'true' && !github.event.repository.private
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
